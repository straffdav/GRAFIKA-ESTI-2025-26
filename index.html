<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAFIKA ESTI 2025-26</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Three.js for WebGL Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* CSS Reset & Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CUSTOM CURSOR (Hides native cursor on desktop) --- */
        @media (pointer: fine) {
            * { cursor: none !important; }
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 140px; 
            height: 140px;
            pointer-events: none;
            z-index: 9999999;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            mix-blend-mode: difference;
        }

        #cursor-bg-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            will-change: transform;
        }

        #cursor-spin-wrapper {
            position: relative;
            width: 18px;
            height: 18px;
            z-index: 2;
            will-change: transform;
        }

        .cursor-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .c-plus {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            transform-origin: center;
            will-change: transform;
        }

        .c-line {
            position: absolute;
            background-color: #fff;
        }

        .c-horizontal { width: 100%; height: 1.5px; top: 50%; left: 0; transform: translateY(-50%); }
        .c-vertical { width: 1.5px; height: 100%; top: 0; left: 50%; transform: translateX(-50%); }

        /* --- LOADING SCREEN STYLES --- */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            will-change: transform;
            display: flex;
            flex-direction: column;
        }

        .loading-black-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .loading-black-bg video {
            width: clamp(120px, 20vw, 240px);
            height: auto;
            object-fit: contain;
            pointer-events: none;
        }

        .loading-prompt-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            opacity: 1; 
            text-align: center;
        }

        .transition-curtain {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100vw;
            height: 120vh;
            background: #000;
            z-index: -1;
            pointer-events: none;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .text-mask {
            overflow: hidden;
            display: block;
        }

        .delayed-reveal {
            opacity: 0;
            visibility: hidden;
            transform: translateY(120%);
            will-change: transform, opacity;
        }

        .loading-text {
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            max-width: 90vw;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            white-space: nowrap; 
        }

        .proceed-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            background-color: transparent;
            text-transform: uppercase;
            transition: background-color 0.3s, color 0.3s;
            pointer-events: auto;
        }

        .proceed-btn:hover {
            background-color: #fff;
            color: #000;
        }

        /* WebGL Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6; 
        }

        /* WebGL Image Effects Canvas */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5; 
        }

        /* Fixed UI Overlay */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10000;
        }

        .logo-container {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1rem;
            pointer-events: auto;
        }

        .logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        .top-right-logo-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: flex-start;
            pointer-events: auto;
        }

        .bkszc-logo-img {
            height: 52px;
            width: auto;
            display: block;
        }

        /* --- SOUND TOGGLE SWITCH --- */
        .sound-switch {
            position: relative; 
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            height: 22px; 
            width: 90px;
            pointer-events: auto;
            font-family: inherit;
            padding: 0;
            overflow: hidden;
        }

        .switch-block {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 22px; 
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            z-index: 2;
        }

        .switch-block::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: -1px; 
            width: 1px;
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .switch-text-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .text-on, .text-off {
            position: absolute;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 66px; 
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 20px;
        }

        .text-on { left: 22px; transform: translateX(0); }
        .text-off { left: 0; transform: translateX(-68px); }

        .sound-switch.is-off .switch-block {
            transform: translateX(66px); 
            background-color: transparent;
        }
        .sound-switch.is-off .switch-block::after { transform: translateX(-22px); }
        .sound-switch.is-off .text-on { transform: translateX(68px); }
        .sound-switch.is-off .text-off { transform: translateX(0); }

        /* Bottom Bar UI */
        .bottom-bar {
            width: 100vw;
            height: clamp(100px, 14vh, 160px);
            display: flex;
            border-top: 1.5px solid #fff;
            background-color: #000;
            pointer-events: auto;
        }

        .bottom-bar.is-loading { position: absolute; bottom: 100%; left: 0; }
        .bottom-bar.is-fixed { position: fixed; bottom: 0; left: 0; z-index: 10000; }

        .bottom-giant-text {
            flex: 0 0 auto;
            display: flex;
            border-right: 1.5px solid #fff;
            height: 100%;
            overflow: hidden;
        }

        .bottom-logo-picture { height: 100%; display: block; }

        .bottom-logo-img {
            height: 100%;
            width: auto;
            max-width: none;
            object-fit: contain;
            display: block;
        }

        .bottom-menu {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            border-right: 1.5px solid #fff;
        }

        .menu-item {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1.5px solid #fff;
            font-size: clamp(0.75rem, 1vw, 1.2rem);
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .menu-item:last-child { border-bottom: none; }

        /* --- CLICKABLE MENU ITEM HOVER INVERT --- */
        .clickable-menu-item {
            cursor: none; 
            text-decoration: none; 
            color: inherit;
            background-color: #000; 
            isolation: isolate; 
        }

        .clickable-menu-item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fff;
            mix-blend-mode: difference;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; 
            z-index: 20; 
        }

        .clickable-menu-item:hover::after { opacity: 1; }

        /* --- INFINITE SCROLLING MARQUEE --- */
        .menu-item.marquee-container {
            padding: 0;
            overflow: hidden;
            position: relative;
            /* Safari Fix: Removed flex, block container */
            display: block; 
            white-space: nowrap;
        }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            height: 100%;
            animation: scrollMarquee 30s linear infinite;
            will-change: transform;
            font-size: 0; /* Removes inline-block phantom spacing */
        }

        .marquee-item {
            height: 100%; 
            margin-right: 0.75rem; 
            width: auto;
            max-width: none;
            display: inline-block;
            vertical-align: top;
        }

        @keyframes scrollMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); } 
        }

        .static-track {
            display: inline-block;
            white-space: nowrap;
            height: 100%;
            font-size: 0;
        }

        .static-item {
            height: 100%;
            margin-right: 0.75rem;
            width: auto;
            display: inline-block;
            vertical-align: top;
        }

        .menu-item.jelentkezz-item { border-bottom: none; }
        .menu-item.jelentkezz-item .marquee-track { animation: scrollMarqueeReverse 60s linear infinite; }

        @keyframes scrollMarqueeReverse {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        .bottom-lines {
            width: 25vw;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; 
        }

        .lines-row {
            flex: 1;
            border-bottom: 1.5px solid #fff;
            width: 100%;
        }

        .lines-row:last-child { border-bottom: none; }

        /* OPTIMIZATION: Replaced div-based lines with a 2D canvas for performance */
        .vertical-lines-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* DOM Shadow Caster */
        #gallery {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; 
        }

        .gallery-item {
            position: absolute;
            top: 0; left: 0;
            
            width: 800px;
            height: 533px; 
            
            /* Safari fix: Top-Left origin prevents transform compound bugs */
            transform-origin: top left;
            will-change: transform, opacity;
            background-color: rgba(0, 0, 0, 1); 
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item:hover { box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.6); }

        /* --- FLOATING CURSOR TOOLTIP --- */
        .floating-tooltip {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            will-change: transform;
        }

        .tooltip-mask {
            background-color: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 360px;
            clip-path: inset(0% 100% 0% 0%); 
            will-change: clip-path;
        }

        .tt-top-row { padding: 16px 20px 8px 20px; }
        .tt-bottom-row { display: flex; align-items: stretch; justify-content: space-between; }
        .tt-category-wrap { padding: 0 24px 16px 20px; display: flex; align-items: center; flex: 1; }
        .tt-text-mask { overflow: hidden; }

        .tt-title {
            font-size: 20px; font-weight: 400; text-transform: uppercase;
            letter-spacing: 0.5px; line-height: 1.2; white-space: normal; 
            word-wrap: break-word; will-change: transform, opacity;
        }

        .tt-category {
            font-size: 20px; font-weight: 400; line-height: 1;
            white-space: nowrap; will-change: transform, opacity;
        }

        .tt-arrow-box {
            background-color: #000; padding: 0 28px; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            flex-shrink: 0; pointer-events: auto; cursor: pointer;
            box-shadow: inset 0 0 0 0px #000;
            transition: background-color 0.1s ease, box-shadow 0.1s ease;
        }

        .tt-arrow-box:active { background-color: #fff; box-shadow: inset 0 0 0 2px #000; }

        .tt-arrow {
            position: relative; width: 80px; height: 1px; background-color: #fff;
            will-change: transform, opacity; transition: background-color 0.1s ease;
        }
        
        .tt-arrow-box:active .tt-arrow { background-color: #000; }

        .tt-arrow::after {
            content: ''; position: absolute; right: 0; top: 50%;
            width: 10px; height: 10px; border-top: 1px solid #fff; border-right: 1px solid #fff;
            transform: translateY(-50%) rotate(45deg); transition: border-color 0.1s ease;
        }

        .tt-arrow-box:active .tt-arrow::after { border-top-color: #000; border-right-color: #000; }

        @media (max-width: 768px) {
            #custom-cursor { display: none !important; }
            .bottom-bar { height: 90px; }
            .bottom-giant-text { padding: 0; }
            .bottom-menu { width: 35vw; min-width: 140px; }
            .menu-item { font-size: 0.7rem; padding: 0 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- Custom Cursor Overlay -->

        <div id="cursor-spin-wrapper">
            <div class="cursor-icon" id="cursor-icon">

    <div id="loading-overlay">

                <div class="text-group">
                    <div class="text-mask"><div class="loading-text delayed-reveal scramble-text" data-text="Fogadd szeretettel a Kreatív és Kézművesipari Technikum">Fogadd szeretettel a Kreatív és Kézművesipari Technikum</div></div>
                    <div class="text-mask"><div class="loading-text delayed-reveal scramble-text" data-text="2025-26-os esti osztályának vizsgamunkáit!">2025-26-os esti osztályának vizsgamunkáit!</div></div>

    <!-- UI Overlay (Persists post-load) -->
    <div class="ui-layer">
        <div class="logo-container">
            <a href="https://kreativtechnikum.hu/" class="clickable-element">
                <img src="logo.svg" alt="Kreatív és Kézművesipari Technikum" class="logo-img" onerror="this.src='https://placehold.co/100x36/000/fff?text=LOGO'">
            </a>
            <button class="sound-switch is-on" id="sound-toggle">
                <div class="switch-block"></div>
                <div class="switch-text-container">
                    <span class="text-on">HANG</span>
                    <span class="text-off">CSEND</span>
                </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            
            let isDesktop = window.innerWidth >= 768;

            // --- AUDIO SETUP ---
            let isSoundEnabled = sessionStorage.getItem('isSoundEnabled') !== 'false';
            let isAudioUnlocked = false; 
            const bgMusic = new Audio('chime.mp3');
            bgMusic.loop = true; 
            bgMusic.volume = 0.4; 

            const savedTime = sessionStorage.getItem('bgMusicTime');
            if (savedTime !== null) bgMusic.currentTime = parseFloat(savedTime);
            window.addEventListener('beforeunload', () => {
                sessionStorage.setItem('bgMusicTime', bgMusic.currentTime);
                sessionStorage.setItem('isSoundEnabled', isSoundEnabled);
            });

            const tickSoundURL = 'ScreenRecording_08-09-2026 20-40-07_1.mp3'; 
            const audioPool = [];
            const poolSize = 10; 
            let poolIndex = 0;
            for (let i = 0; i < poolSize; i++) {
                const a = new Audio(tickSoundURL);
                a.volume = 0.1; 
                audioPool.push(a);
            }

            const tingSoundURL = 'ting.mp3'; 
            const tingAudioPool = [];
            const tingPoolSize = 5; 
            let tingPoolIndex = 0;
            for (let i = 0; i < tingPoolSize; i++) {
                const a = new Audio(tingSoundURL);
                a.volume = 0.3; 
                tingAudioPool.push(a);
            }

            const tryUnlockAudio = () => {
                if (isAudioUnlocked) return;
                audioPool.forEach(a => { const p = a.play(); if (p) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {}); });
                tingAudioPool.forEach(a => { const p = a.play(); if (p) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {}); });

                if (isSoundEnabled) {
                    const bgPromise = bgMusic.play();
                    if (bgPromise !== undefined) {
                        bgPromise.then(() => {
                            isAudioUnlocked = true;
                            ['pointerdown', 'touchstart', 'keydown', 'wheel', 'mousemove'].forEach(e => window.removeEventListener(e, tryUnlockAudio));
                        }).catch(() => { isAudioUnlocked = false; });
                    }
                } else {
                    isAudioUnlocked = true; 
                }
            };

            if (isSoundEnabled) {
                bgMusic.play().then(() => { isAudioUnlocked = true; }).catch(() => {
                    ['pointerdown', 'touchstart', 'keydown', 'wheel', 'mousemove'].forEach(e => window.addEventListener(e, tryUnlockAudio, { passive: true }));
                });
            }

            function playTingSound(pitchRate = 1.0) {
                if (!isAudioUnlocked || !isSoundEnabled) return;
                const a = tingAudioPool[tingPoolIndex];
                a.playbackRate = pitchRate; a.currentTime = 0; 
                const p = a.play(); if (p) p.catch(() => {}); 
                tingPoolIndex = (tingPoolIndex + 1) % tingPoolSize; 
            }
            
            function playTickSound() {
                if (!isAudioUnlocked || !isSoundEnabled) return;
                const a = audioPool[poolIndex];
                a.currentTime = 0; 
                const p = a.play(); if (p) p.catch(() => {}); 
                poolIndex = (poolIndex + 1) % poolSize; 
            }

            const soundToggleBtn = document.getElementById('sound-toggle');
            if (!isSoundEnabled) { soundToggleBtn.classList.remove('is-on'); soundToggleBtn.classList.add('is-off'); }

            soundToggleBtn.addEventListener('click', () => {
                tryUnlockAudio();
                isSoundEnabled = !isSoundEnabled;
                sessionStorage.setItem('isSoundEnabled', isSoundEnabled);
                if (isSoundEnabled) {
                    soundToggleBtn.classList.remove('is-off'); soundToggleBtn.classList.add('is-on');
                    bgMusic.play().catch(() => {});
                } else {
                    soundToggleBtn.classList.remove('is-on'); soundToggleBtn.classList.add('is-off');
                    bgMusic.pause();
                }
            });

            // --- CUSTOM CURSOR ---

                float bayer8x8(vec2 a) { return bayer4x4(a) + bayer2x2(floor(a / 4.0)) / 16.0; }
                float bayer16x16(vec2 a) { return bayer8x8(a) + bayer2x2(floor(a / 8.0)) / 64.0; }

                vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
                float snoise(vec2 v){
                  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                  vec2 i  = floor(v + dot(v, C.yy) );
                  vec2 x0 = v -   i + dot(i, C.xx);
                  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
                  i = mod(i, 289.0);
                  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);

                    const bottomBarTopRatio = (window.innerHeight - bottomBarPx) / window.innerHeight;
                    const maxImageHalfHeightRatio = (baseH * 0.85 / 2) / window.innerHeight;
                    const maxY = bottomBarTopRatio - maxImageHalfHeightRatio;
                    const minY = maxImageHalfHeightRatio + 0.01; 
                    const centerY = (maxY + minY) / 2;
                    const amplitude = (maxY - minY) / 2;
                    y = centerY + (wave * amplitude);
                    if (t < 0.05) o = t / 0.05; 
                    else if (t > 1.10 && t < 1.30) o = (1.30 - t) / 0.2; 
                    else if (t >= 1.30) o = 0; else o = 1;
                } else {
                    y = -0.15 + (t * 2.2); 
                    const wave = Math.sin((t - 0.02) * Math.PI * 4);
                    const stretch = Math.abs(wave);
                    x = 0.5 + (wave * 0.25);
                    const baseW = window.innerWidth * 0.55;
                    const baseH = window.innerHeight * 0.22;
                    wPx = baseW * (1 - stretch * 0.15);
                    hPx = baseH * (1 + stretch * 0.40);
                    if (t < 0.05) o = t / 0.05; 
                    else if (t > 0.45 && t < 0.55) o = (0.55 - t) / 0.10; 
                    else if (t >= 0.55) o = 0; else o = 1;
                }
                const z = Math.round((2 - t) * 1000);
                return { x, y, wPx, hPx, z, o };
            }

            let targetScroll = 10000; 
            let currentScroll = targetScroll;
            let userScrollDistance = 0; 
            let lastUserTickThreshold = 0;

            function checkUserTick() {
                const currentThreshold = Math.floor(userScrollDistance / 60);
                if (currentThreshold !== lastUserTickThreshold) {
                    playTickSound(); lastUserTickThreshold = currentThreshold;
                }
            }
            
            window.addEventListener('wheel', (e) => { 
                const delta = e.deltaY * 0.35; targetScroll += delta; userScrollDistance += Math.abs(delta); checkUserTick();
            });
            
            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY; const delta = (touchStartY - touchY) * 1.0;
                targetScroll += delta; userScrollDistance += Math.abs(delta); checkUserTick(); touchStartY = touchY;
            }, { passive: true });

            const clock = new THREE.Clock();

            // Setup sizes early for Canvas 2D
            resizeLinesCanvas();

            function render() {
                const time = clock.getElapsedTime();
                targetScroll += 0.8; 
                let scrollVelocity = (targetScroll - currentScroll) * 0.06;
                currentScroll += scrollVelocity;
                
                // 1. BG RENDER
                bgMaterial.uniforms.uTime.value = time;
                bgMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
                bgMaterial.uniforms.uScroll.value = currentScroll;
                bgRenderer.render(bgScene, bgCamera);

                // 2. CURSOR SPIN SYNC
                if (isDesktop) {
                    const cursorSpinWrapper = document.getElementById('cursor-spin-wrapper');
                    if (cursorSpinWrapper) cursorSpinWrapper.style.transform = `rotate(${currentScroll * 0.3}deg)`;
                }

                // 3. LINES CANVAS 2D UPDATE (Optimization replacing 50 DOM elements)
                linesCtx.clearRect(0, 0, linesCanvas.width, linesCanvas.height);
                linesCtx.fillStyle = '#fff';
                const cw = linesCanvas.clientWidth;
                const ch = linesCanvas.clientHeight;
                for(let i = 1; i < 50; i++) {
                    const speed = 0.4 * Math.pow(0.92, i);
                    const phase = (time * speed) + (currentScroll * 0.01);
                    const amplitude = 12 * Math.pow(0.9, i);
                    const xOffset = Math.sin(phase) * amplitude;
                    const baseLeft = cw * (1 - Math.pow(0.88, i));
                    linesCtx.fillRect(baseLeft + xOffset, 0, 1.5, ch);
                }

                // 4. GALLERY CALCULATION
                const globalOffset = currentScroll / 4000;
                let topHoverIndex = -1;
                let maxZ = -Infinity;
                let minDist = Infinity; 
                const calculatedStates = [];
                
                DOMItems.forEach((item, index) => {
                    let t = (globalOffset + (index / galleryData.length) * 2.0) % 2.0;
                    if (t < 0) t = (t % 2.0) + 2.0; 

                    const state = getInterpolatedState(t);
                    const xPx = state.x * window.innerWidth;
                    const yPx = state.y * window.innerHeight;
                    const finalW = state.wPx;
                    const finalH = state.hPx;
                    
                    calculatedStates.push({ xPx, yPx, finalW, finalH, baseZ: state.z, o: state.o });

                    if (interactionsEnabled && state.o > 0.1) {
                        const left = xPx - finalW / 2; const right = xPx + finalW / 2;
                        const top = yPx - finalH / 2; const bottom = yPx + finalH / 2;
                        if (isDesktop) {
                            if (mouseX >= left && mouseX <= right && mouseY >= top && mouseY <= bottom) {
                                if (state.z > maxZ) { maxZ = state.z; topHoverIndex = index; }
                            }
                        } else {
                            const screenCenterX = window.innerWidth / 2;
                            const screenCenterY = (window.innerHeight - 90) / 2; 
                            const dist = Math.hypot(xPx - screenCenterX, yPx - screenCenterY);
                            if (dist < minDist && dist < 180) { minDist = dist; topHoverIndex = index; }
                        }
                    }
                });
                
                if (topHoverIndex !== currentHoveredIndex) {
                    if (currentHoveredIndex !== -1) triggerLeave(currentHoveredIndex);
                    if (topHoverIndex !== -1) triggerEnter(topHoverIndex);
                    currentHoveredIndex = topHoverIndex;
                }

                DOMItems.forEach((item, index) => {
                    const cState = calculatedStates[index];
                    const mesh = meshes[index];
                    const iState = itemStates[index];
                    const isHovered = (index === currentHoveredIndex);
                    
                    const isVisible = cState.o > 0.005;
                    
                    // OPTIMIZATION: Aggressive WebGL Culling!
                    // This acts like "pre-rendering" because we only execute the heavy WebGL shader 
                    // on the ONE image that is currently being hovered. The other 15 meshes are skipped entirely.
                    mesh.visible = isVisible && (iState.webglAlpha > 0.001);
                    
                    item.style.pointerEvents = isVisible ? 'auto' : 'none';

                    const finalZ = cState.baseZ + (isHovered ? 5000 : 0);

                    // OPTIMIZATION: Pre-calculate the -50% translation into the X/Y coordinates
                    // Safari performs much better with a single, clean translate3d statement
                    const scaleX = cState.finalW / 800; // Base width is 800
                    const scaleY = cState.finalH / 533; // Base height is 533
                    const tx = Math.round(cState.xPx - (400 * scaleX));
                    const ty = Math.round(cState.yPx - (266.5 * scaleY));
                    
                    item.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scaleX}, ${scaleY})`;
                    item.style.zIndex = Math.round(finalZ);
                    item.style.opacity = cState.o.toFixed(3);

                    // 5. WEBGL MESH SYNC
                    if (mesh.visible) {
                        mesh.position.set(cState.xPx - innerWidth / 2, -(cState.yPx - innerHeight / 2), finalZ);
                        mesh.scale.set(Math.round(cState.finalW), Math.round(cState.finalH), 1);
                        mesh.material.uniforms.uOpacity.value = cState.o * iState.webglAlpha;
                        mesh.material.uniforms.uMeshSize.value.set(cState.finalW, cState.finalH);

                        if (isHovered) {
                            const left = cState.xPx - cState.finalW / 2; const top = cState.yPx - cState.finalH / 2;
                            const effectX = isDesktop ? mouseX : cState.xPx; const effectY = isDesktop ? mouseY : cState.yPx;
                            const uvX = (effectX - left) / cState.finalW; const uvY = 1.0 - ((effectY - top) / cState.finalH);
                            gsap.to(mesh.material.uniforms.uMouse.value, { x: uvX, y: uvY, duration: 0.1, overwrite: 'auto' });
                        }
                    }
                });

                if (!isDesktop && currentHoveredIndex !== -1) {
                    const tWidth = tooltip.offsetWidth || 300; const tHeight = tooltip.offsetHeight || 60;
                    xTo(window.innerWidth / 2 - tWidth / 2); yTo(window.innerHeight - 90 - tHeight - 20); 
                }

                renderer.render(scene, camera);
                requestAnimationFrame(render);
            }

            render();

            window.addEventListener('resize', () => {
                resizeLinesCanvas();

                bgCamera.updateProjectionMatrix();
                bgRenderer.setSize(window.innerWidth, window.innerHeight);
                bgMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);

                camera.left = window.innerWidth / -2;
                camera.right = window.innerWidth / 2;
                camera.top = window.innerHeight / 2;
                camera.bottom = window.innerHeight / -2;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);

                const currentIsDesktop = window.innerWidth >= 768;
                if(isDesktop !== currentIsDesktop) {
                    isDesktop = currentIsDesktop; location.reload(); 
                }
            });

        });
    </script>
</body>
</html>
