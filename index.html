<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAFIKA ESTI 2025-26</title>
    <link rel="icon" type="image/png" href="favicon.png">

    
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Three.js for WebGL Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* CSS Reset & Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CUSTOM CURSOR (Hides native cursor on desktop) --- */
        @media (pointer: fine) {
            * { cursor: none !important; }
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 140px; 
            height: 140px;
            pointer-events: none; /* Crucial so it doesn't block clicks */
            z-index: 9999999;
            transform: translate(-50%, -50%); /* Center on mouse */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cursor-dither-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* WRAPPER: Handles scroll rotation without fighting GSAP hover rotation */
        #cursor-spin-wrapper {
            position: relative;
            width: 18px;
            height: 18px;
            z-index: 2;
            will-change: transform;
        }

        .cursor-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .c-plus {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            transform-origin: center;
            will-change: transform;
        }

        .c-line {
            position: absolute;
            background-color: #fff;
        }

        .c-horizontal { width: 100%; height: 1.5px; top: 50%; left: 0; transform: translateY(-50%); }
        .c-vertical { width: 1.5px; height: 100%; top: 0; left: 50%; transform: translateX(-50%); }


        /* --- LOADING SCREEN STYLES --- */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            will-change: transform;
            display: flex;
            flex-direction: column;
        }

        .loading-black-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .loading-black-bg video {
            width: clamp(120px, 20vw, 240px);
            height: auto;
            object-fit: contain;
            pointer-events: none;
        }

        .loading-prompt-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            opacity: 1; 
            text-align: center;
        }

        /* --- PAGE TRANSITION CURTAIN --- */
        .transition-curtain {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100vw;
            height: 120vh;
            background: #000;
            z-index: -1;
            pointer-events: none;
        }

        /* --- MASKED REVEAL & TEXT STYLES --- */
        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .text-mask {
            overflow: hidden;
            display: block;
        }

        .delayed-reveal {
            opacity: 0;
            visibility: hidden;
            transform: translateY(120%);
            will-change: transform, opacity;
        }

        .loading-text {
            font-size: clamp(0.75rem, 1.5vw, 1rem);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            max-width: 90vw;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            white-space: nowrap; 
        }

        .proceed-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            background-color: transparent;
            text-transform: uppercase;
            transition: background-color 0.3s, color 0.3s;
            pointer-events: auto;
        }

        .proceed-btn:hover {
            background-color: #fff;
            color: #000;
        }

        /* Background Dither Noise Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6; 
        }

        /* WebGL Canvas */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5; 
        }

        /* Fixed UI Overlay */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10000;
        }

        /* Top Left Logo */
        .logo-container {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            flex-direction: column; /* Stack them vertically */
            align-items: flex-end; /* Aligns the switch to the right edge of the logo */
            gap: 1rem; /* Gap between logo and switch */
            pointer-events: auto;
        }

        .logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        /* Top Right Logo - Stuck flush to the corner */
        .top-right-logo-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: flex-start;
            pointer-events: auto;
        }

        .bkszc-logo-img {
            height: 52px;
            width: auto;
            display: block;
        }

        /* --- SOUND TOGGLE SWITCH --- */
        .sound-switch {
            position: relative; 
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            height: 22px; 
            width: 90px; /* Aligns perfectly with the foot of the 'k' */
            pointer-events: auto;
            font-family: inherit;
            padding: 0;
            overflow: hidden;
        }

        .switch-block {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 22px; 
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            z-index: 2;
        }

        .switch-block::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: -1px; 
            width: 1px;
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .switch-text-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .text-on, .text-off {
            position: absolute;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 66px; 
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 20px;
        }

        .text-on {
            left: 22px;
            transform: translateX(0);
        }

        .text-off {
            left: 0;
            transform: translateX(-68px); 
        }

        .sound-switch.is-off .switch-block {
            transform: translateX(66px); 
            background-color: transparent;
        }

        .sound-switch.is-off .switch-block::after {
            transform: translateX(-22px); 
        }

        .sound-switch.is-off .text-on {
            transform: translateX(68px); 
        }

        .sound-switch.is-off .text-off {
            transform: translateX(0); 
        }

        /* Bottom Bar UI */
        .bottom-bar {
            width: 100vw;
            height: clamp(100px, 14vh, 160px);
            display: flex;
            border-top: 1.5px solid #fff;
            background-color: #000;
            pointer-events: auto;
        }

        .bottom-bar.is-loading {
            position: absolute;
            bottom: 100%; 
            left: 0;
        }

        .bottom-bar.is-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10000;
        }

        .bottom-giant-text {
            flex: 0 0 auto; /* Force container to exactly hug the image width */
            display: flex;
            border-right: 1.5px solid #fff;
            height: 100%;
            overflow: hidden;
        }

        .bottom-logo-picture {
            height: 100%;
            display: block;
        }

        .bottom-logo-img {
            height: 100%;
            width: auto;
            max-width: none; /* Removes restriction so the container snaps strictly to the image */
            object-fit: contain;
            display: block;
        }

        .bottom-menu {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            border-right: 1.5px solid #fff;
        }

        .menu-item {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1.5px solid #fff;
            font-size: clamp(0.75rem, 1vw, 1.2rem);
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* --- CLICKABLE MENU ITEM HOVER INVERT --- */
        .clickable-menu-item {
            cursor: none; 
            text-decoration: none; 
            color: inherit;
            background-color: #000; /* Solid base for difference blending */
            isolation: isolate; /* Prevents blend-mode bugs with CSS animations */
        }

        .clickable-menu-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            mix-blend-mode: difference;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; 
            z-index: 20; /* Keep it above the marquee images */
        }

        .clickable-menu-item:hover::after {
            opacity: 1;
        }

        /* --- INFINITE SCROLLING MARQUEE --- */
        .menu-item.marquee-container {
            padding: 0;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: stretch;
        }

        .marquee-track {
            display: flex;
            align-items: stretch; 
            height: 100%;
            width: max-content;
            animation: scrollMarquee 30s linear infinite;
            will-change: transform;
        }

        .marquee-item {
            height: 100%; 
            margin-right: 0.75rem; 
            width: auto;
            flex-shrink: 0;
            display: block;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        /* --- STATIC ROW (NO ANIMATION) FOR AZ ISKOLÁRÓL --- */
        .static-track {
            display: flex;
            align-items: stretch;
            height: 100%;
            width: max-content;
        }

        .static-item {
            height: 100%;
            margin-right: 0.75rem;
            width: auto;
            flex-shrink: 0;
            display: block;
        }

        .menu-item.multi-line {
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
        }

        .menu-item.highlight {
            background-color: #fff;
            color: #000;
            font-weight: 600;
        }

        /* --- JELENTKEZZ REVERSE MARQUEE --- */
        .menu-item.jelentkezz-item {
            border-bottom: none;
        }

        .menu-item.jelentkezz-item .marquee-track {
            animation: scrollMarqueeReverse 60s linear infinite;
        }

        @keyframes scrollMarqueeReverse {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .bottom-lines {
            width: 25vw;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; 
        }

        .lines-row {
            flex: 1;
            border-bottom: 1.5px solid #fff;
            width: 100%;
        }

        .lines-row:last-child {
            border-bottom: none;
        }

        .vertical-lines-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .v-line {
            position: absolute;
            top: 0; 
            bottom: 0; 
            width: 1.5px;
            background-color: #fff;
            will-change: transform;
        }

        /* DOM Shadow Caster */
        #gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; 
        }

        .gallery-item {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            will-change: transform;
            background-color: rgba(0, 0, 0, 1); 
            box-shadow: 0px 4px 44.3px 35px rgba(0, 0, 0, 0.55);
            transition: box-shadow 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item:hover {
            box-shadow: 0px 8px 50px 40px rgba(0, 0, 0, 0.65);
        }

        /* --- FLOATING CURSOR TOOLTIP --- */
        .floating-tooltip {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            will-change: transform;
        }

        .tooltip-mask {
            background-color: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            width: max-content;
            max-width: 360px;
            clip-path: inset(0% 100% 0% 0%); 
            will-change: clip-path;
        }

        .tt-top-row {
            padding: 16px 20px 8px 20px;
        }

        .tt-bottom-row {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
        }

        .tt-category-wrap {
            padding: 0 24px 16px 20px;
            display: flex;
            align-items: center;
            flex: 1;
        }
        
        .tt-text-mask {
            overflow: hidden; 
        }

        .tt-title {
            font-size: 20px;
            font-weight: 400; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
            white-space: normal; 
            word-wrap: break-word;
            will-change: transform, opacity;
        }

        .tt-category {
            font-size: 20px;
            font-weight: 400; 
            line-height: 1;
            white-space: nowrap;
            will-change: transform, opacity;
        }

        .tt-arrow-box {
            background-color: #000;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0; 
            pointer-events: auto;
            cursor: pointer;
            box-shadow: inset 0 0 0 0px #000;
            transition: background-color 0.1s ease, box-shadow 0.1s ease;
        }

        .tt-arrow-box:active {
            background-color: #fff;
            box-shadow: inset 0 0 0 2px #000;
        }

        .tt-arrow {
            position: relative;
            width: 80px;
            height: 1px;
            background-color: #fff;
            will-change: transform, opacity;
            transition: background-color 0.1s ease;
        }
        
        .tt-arrow-box:active .tt-arrow {
            background-color: #000;
        }

        .tt-arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 10px;
            height: 10px;
            border-top: 1px solid #fff;
            border-right: 1px solid #fff;
            transform: translateY(-50%) rotate(45deg);
            transition: border-color 0.1s ease;
        }

        .tt-arrow-box:active .tt-arrow::after {
            border-top-color: #000;
            border-right-color: #000;
        }

        @media (max-width: 768px) {
            #custom-cursor { display: none !important; }
            .bottom-bar { height: 90px; }
            .bottom-giant-text { padding: 0; }
            .bottom-menu { width: 35vw; min-width: 140px; }
            .menu-item { font-size: 0.7rem; padding: 0 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- Custom Cursor Overlay -->
    <div id="custom-cursor">
        <canvas id="cursor-dither-canvas"></canvas>
        <div id="cursor-spin-wrapper">
            <div class="cursor-icon" id="cursor-icon">

                    <div class="c-line c-horizontal"></div>
                    <div class="c-line c-vertical"></div>
                </div>
                <div class="c-plus" id="c-plus-2">
                    <div class="c-line c-horizontal"></div>
                    <div class="c-line c-vertical"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="bottom-bar is-loading" id="main-bottom-bar">
            <div class="bottom-giant-text">
                <picture class="bottom-logo-picture">
                    <source media="(max-width: 768px)" srcset="grafikaesti_phone.svg">
                    <img src="grafikaesti.svg" alt="Grafika Esti" class="bottom-logo-img">

                        <img src="2026.svg" alt="2026" class="marquee-item">

                        <img src="2026.svg" alt="2026" class="marquee-item">
                        <img src="2026.svg" alt="2026" class="marquee-item">
                        <img src="2026.svg" alt="2026" class="marquee-item">
                        <img src="2026.svg" alt="2026" class="marquee-item">
                        <img src="2026.svg" alt="2026" class="marquee-item">
                        <img src="2026.svg" alt="2026" class="marquee-item">
                    </div>
                </a>
                <a href="#" class="menu-item marquee-container clickable-menu-item">
                    <div class="static-track">

                        <img src="aziskolarol.gif" alt="Az iskoláról" class="static-item">

                        <img src="aziskolarol.gif" alt="Az iskoláról" class="static-item">

                <a href="#" class="menu-item marquee-container jelentkezz-item clickable-menu-item">
                    <div class="marquee-track">

                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">

                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">

                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                        <img src="jelentkezz.svg" alt="Jelentkezz" class="marquee-item">
                    </div>
                </a>
            </div>
            <div class="bottom-lines">
                <div class="lines-row"></div>
                <div class="lines-row"></div>
                <div class="lines-row"></div>
                <div class="vertical-lines-overlay" id="vertical-lines"></div>
            </div>
        </div>
        <div class="loading-black-bg">
            <div class="loading-prompt-content" id="loading-prompt-content">
                <div class="text-group">
                    <div class="text-mask">
                        <div class="loading-text delayed-reveal scramble-text" data-text="Az oldal hanggal működik.">Az oldal hanggal működik.</div>

                <video id="loading-video" src="LoadingLogo.mp4" muted playsinline></video>
                
                <div class="text-group">

                    </div>

                        <div class="loading-text delayed-reveal scramble-text" data-text="2025-26-os esti osztályának vizsgamunkáit!">2025-26-os esti osztályának vizsgamunkáit!</div>

    <canvas id="bg-canvas"></canvas>
    <canvas id="webgl-canvas"></canvas>

    <div class="floating-tooltip" id="cursor-tooltip">
        <div class="tooltip-mask" id="tt-mask">

                <div class="tt-text-mask">
                    <div class="tt-title" id="tt-title">Babolcsai Patrícia</div>

            </div>
            <div class="tt-bottom-row">
                <div class="tt-category-wrap tt-text-mask">

                </div>
                <div class="tt-arrow-box">
                    <div class="tt-arrow" id="tt-arrow"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Overlay (Persists post-load) -->
    <div class="ui-layer">
        <div class="logo-container">
            <a href="https://kreativtechnikum.hu/" class="clickable-element">
                <img src="logo.svg" alt="Kreatív és Kézművesipari Technikum" class="logo-img" onerror="this.style.display='none'">

            <button class="sound-switch is-on" id="sound-toggle">

                    <span class="text-on">HANG</span>

            }

            const tingSoundURL = 'ting.mp3';

            // Centralized unlock logic
            const tryUnlockAudio = () => {
                if (isAudioUnlocked) return;
                
                // Initialize sfx
                audioPool.forEach(a => {
                    const p = a.play();
                    if (p !== undefined) {
                        p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
                    }
                });
                tingAudioPool.forEach(a => {
                    const p = a.play();
                    if (p !== undefined) {
                        p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
                    }
                });

                if (isSoundEnabled) {
                    const bgPromise = bgMusic.play();
                    if (bgPromise !== undefined) {
                        bgPromise.then(() => {
                            isAudioUnlocked = true;
                            // Remove stealth listeners on success
                            ['pointerdown', 'touchstart', 'keydown', 'wheel', 'mousemove'].forEach(e => {
                                window.removeEventListener(e, tryUnlockAudio);
                            });
                        }).catch(() => {
                            // Still blocked by browser, leave listeners active to try again
                            isAudioUnlocked = false;

                    isAudioUnlocked = true;

            const cursorDitherMaterial = new THREE.ShaderMaterial({
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uHoverState;
                    uniform float uScrollVelocity; 
                    varying vec2 vUv;
                    
                    float bayer2x2(vec2 a) {
                        vec2 p = floor(mod(a, 2.0));
                        return (p.x * 2.0 + p.y * 3.0 - p.x * p.y * 4.0) / 4.0;
                    }
                    float bayer4x4(vec2 a) { return bayer2x2(a) + bayer2x2(floor(a / 2.0)) / 4.0; }
                    float bayer8x8(vec2 a) { return bayer4x4(a) + bayer2x2(floor(a / 4.0)) / 16.0; }

                    void main() {
                        vec2 center = vec2(0.5);
                        float dist = distance(vUv, center);
                        
                        float baseRadius = mix(0.18, 0.40, uHoverState);
                        
                        float shrink = clamp(uScrollVelocity * 0.015, 0.0, 0.14);
                        baseRadius = max(0.04, baseRadius - shrink);
                        
                        float flicker = (sin(uTime * 15.0) * 0.015 + cos(uTime * 25.0) * 0.01) * (1.0 + uHoverState * 2.0);
                        float radius = baseRadius + flicker;
                        
                        if(dist > radius + 0.1) discard; 
                        
                        float intensity = 1.0 - smoothstep(radius - 0.05, radius + 0.1, dist);
                        
                        float bayerVal = bayer8x8(gl_FragCoord.xy * 0.5); 
                        float dithered = step(bayerVal, intensity);
                        
                        if(dithered < 0.1) discard; 
                        
                        gl_FragColor = vec4(0.65, 0.65, 0.65, 0.7); 
                    }
                `,
                uniforms: {
                    uTime: { value: 0 },
                    uHoverState: { value: 0 },
                    uScrollVelocity: { value: 0 }

                                        y: 0,
                                        duration: 1.2,
                                        ease: 'power3.inOut',
                                        onComplete: () => {

                                            gsap.set(bottomBar, { clearProps: "transform" });

                    });

            function triggerRevealAnimation() {
                const tl = gsap.timeline();
                document.querySelectorAll('.delayed-reveal').forEach((el, index) => {
                    tl.fromTo(el, 
                        { y: '120%', autoAlpha: 0 }, 
                        { y: '0%', autoAlpha: 1, duration: 0.8, ease: 'power3.out',
                          onStart: () => {
                              if (el.classList.contains('scramble-text')) scrambleText(el);
                          }
                        }, index * 0.15); 
                });
            }

            function scrambleText(element) {
                const original = element.getAttribute('data-text');
                if (!original) return;
                const chars = '!<>-_/[]{}—=+*^?#________';
                let iteration = 0;
                const maxIterations = 20; 
                
                const interval = setInterval(() => {
                    element.innerText = original.split("").map((letter, index) => {
                        if (index < iteration) return original[index];
                        if (original[index] === " ") return " "; 
                        return chars[Math.floor(Math.random() * chars.length)];
                    }).join("");
                    
                    iteration += original.length / maxIterations;
                    
                    if (iteration >= original.length) {
                        clearInterval(interval);
                        element.innerText = original;
                    }
                }, 40);
            }

            const galleryData = [
                { src: 'img/1.jpg', name: 'Babolcsai Patrícia', title: 'Metahuman Academy', link: 'layout.html' },

            const bgCanvas = document.getElementById('bg-canvas');

            const bgFragmentShader = `
                uniform vec2 uResolution;
                uniform float uTime;
                uniform float uScroll;
                varying vec2 vUv;

                float bayer2x2(vec2 a) {
                    vec2 p = floor(mod(a, 2.0));
                    return (p.x * 2.0 + p.y * 3.0 - p.x * p.y * 4.0) / 4.0;
                }
                float bayer4x4(vec2 a) { return bayer2x2(a) + bayer2x2(floor(a / 2.0)) / 4.0; }
                float bayer8x8(vec2 a) { return bayer4x4(a) + bayer2x2(floor(a / 4.0)) / 16.0; }
                float bayer16x16(vec2 a) { return bayer8x8(a) + bayer2x2(floor(a / 8.0)) / 64.0; }

                vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
                float snoise(vec2 v){
                  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                  vec2 i  = floor(v + dot(v, C.yy) );
                  vec2 x0 = v -   i + dot(i, C.xx);
                  vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
                  i = mod(i, 289.0);
                  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                  m = m*m ; m = m*m ;
                  vec3 x = 2.0 * fract(p * C.www) - 1.0;
                  vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5);
                  vec3 a0 = x - ox;
                  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                  vec3 g;
                  g.x  = a0.x  * x0.x  + h.x  * x0.y;
                  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                  return 130.0 * dot(m, g);
                }

                float fbm(vec2 p, float time) {
                    float val = 0.0;
                    float amp = 1.0;
                    float freq = 1.0;
                    vec2 movement = vec2(time * 0.05, time * 0.03);
                    for (int i = 0; i < 5; i++) {
                        val += amp * snoise((p + movement) * freq);
                        p = p * 1.56 + vec2(17.2, 43.7);
                        amp *= 0.09; 
                        freq *= 1.78; 
                    }
                    return val;
                }

                void main() {
                    vec2 st = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                    st.y += uScroll * 0.00015;
                    float noiseVal = fbm(st * 0.3, uTime * 0.15);
                    float luma = noiseVal * 0.5 + 0.5;
                    luma = clamp(luma - 0.55, 0.0, 1.0) * 0.9;
                    
                    float ditherSize = 3.0;
                    vec2 gridPos = floor(gl_FragCoord.xy / ditherSize);
                    float bayerVal = bayer16x16(gridPos);
                    float centeredDither = bayerVal - 0.5;
                    
                    float levels = 3.0;
                    float colorSteps = levels - 1.0;
                    
                    float ditheredLuma = luma + (centeredDither / colorSteps);
                    ditheredLuma = clamp(floor(ditheredLuma * colorSteps + 0.5) / colorSteps, 0.0, 1.0);
                    
                    vec3 finalColor = vec3(ditheredLuma * 0.85); 
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

            const bgMaterial = new THREE.ShaderMaterial({

            const vertexShader = `

            `;
            
            const fragmentShader = `
                uniform sampler2D uTexture;
                uniform vec2 uMouse;
                uniform float uHover;
                uniform float uOpacity;
                uniform vec2 uMeshSize;
                uniform vec2 uImageSize;
                varying vec2 vUv;

                float bayer2x2(vec2 a) {
                    vec2 p = floor(mod(a, 2.0));

                }
                float bayer4x4(vec2 a) { return bayer2x2(a) + bayer2x2(floor(a / 2.0)) / 4.0; }
                float bayer8x8(vec2 a) { return bayer4x4(a) + bayer2x2(floor(a / 4.0)) / 16.0; }
                float bayer16x16(vec2 a) { return bayer8x8(a) + bayer2x2(floor(a / 8.0)) / 64.0; }

                void main() {
                    vec2 ratio = vec2(
                        min((uMeshSize.x / uMeshSize.y) / (uImageSize.x / uImageSize.y), 1.0),
                        min((uMeshSize.y / uMeshSize.x) / (uImageSize.y / uImageSize.x), 1.0)
                    );
                    vec2 finalUv = vec2(vUv.x * ratio.x + (1.0 - ratio.x) * 0.5, vUv.y * ratio.y + (1.0 - ratio.y) * 0.5);

                    vec3 pristineColor = texture2D(uTexture, finalUv).rgb;
                    
                    float ditherDotScale = 2.0; 
                    float ditherValue = bayer16x16(vUv * (uMeshSize / ditherDotScale));
                    float centeredDither = ditherValue - 0.5; 
                    
                    float luminance = dot(pristineColor, vec3(0.2126, 0.7152, 0.0722));
                    luminance = (luminance - 0.5) * 0.9 + 0.5; 
                    luminance *= 0.96; 
                    
                    float levels = 3.0;
                    float colorSteps = levels - 4.0; 
                    float ditheredLuma = luminance + (centeredDither / colorSteps);
                    ditheredLuma = clamp(floor(ditheredLuma * colorSteps + 0.5) / colorSteps, 0.0, 1.0);
                    
                    vec3 ditheredColor = vec3(ditheredLuma); 
                    
                    vec2 meshRatio = vec2(uMeshSize.x / min(uMeshSize.x, uMeshSize.y), uMeshSize.y / min(uMeshSize.x, uMeshSize.y));
                    vec2 aspectUv = vUv * meshRatio;
                    vec2 aspectMouse = uMouse * meshRatio;
                    float dist = distance(aspectUv, aspectMouse);
                    
                    float mouseFalloff = exp(-dist * dist * 1.0);
                    float localIntensity = (0.40 + 0.85 * mouseFalloff) * uHover;
                    float isDithered = step(ditherValue, localIntensity) * step(0.005, uHover);
                    
                    vec3 finalColor = mix(pristineColor, ditheredColor, isDithered);
                    gl_FragColor = vec4(finalColor, uOpacity);
                }
            `;

            const planeGeometry = new THREE.PlaneGeometry(1, 1, 32, 32);
            const textureLoader = new THREE.TextureLoader(manager);
            
            const meshes = [];
            const DOMItems = [];
            const itemStates = []; 
            const gallery = document.getElementById('gallery');
            const vLines = []; 
            
            const overlayLines = document.getElementById('vertical-lines');
            if (overlayLines) {
                for(let i = 1; i < 50; i++) {
                    const line = document.createElement('div');
                    line.className = 'v-line';
                    line.style.left = `${100 * (1 - Math.pow(0.88, i))}%`;
                    overlayLines.appendChild(line);
                    vLines.push(line);
                }
            }

            const tooltip = document.getElementById('cursor-tooltip');
            const tooltipMask = document.getElementById('tt-mask');
            const tooltipTitle = document.getElementById('tt-title');
            const tooltipCategory = document.getElementById('tt-category');
            const tooltipArrow = document.getElementById('tt-arrow');
            const tooltipArrowBox = document.querySelector('.tt-arrow-box');

            let mouseX = -1000;
            let mouseY = -1000;
            
            let xTo = gsap.quickTo(tooltip, "x", {duration: 0.15, ease: "power2.out"});
            let yTo = gsap.quickTo(tooltip, "y", {duration: 0.15, ease: "power2.out"});

            window.addEventListener("mousemove", (e) => {
                if (!isDesktop) return; 
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                let targetX = mouseX + 15;
                let targetY = mouseY + 15;
                const tWidth = tooltip.offsetWidth;
                const tHeight = tooltip.offsetHeight;
                
                if (targetX + tWidth > window.innerWidth - 10) targetX = mouseX - tWidth - 15;
                if (targetY + tHeight > window.innerHeight - 10) targetY = mouseY - tHeight - 15;
                
                xTo(targetX);
                yTo(targetY);
            });

            tooltipArrowBox.addEventListener('click', (e) => {
                if (currentHoveredIndex !== -1 && interactionsEnabled && !isTransitioning) {
                    transitionToPage(galleryData[currentHoveredIndex].link);
                }
            });

            galleryData.forEach((data, index) => {
                const a = document.createElement('a');
                a.className = 'gallery-item';
                a.href = data.link;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    // On mobile, prevent clicking the image directly from transitioning
                    if (interactionsEnabled && isDesktop) {
                        transitionToPage(data.link);
                    }
                }); 
                gallery.appendChild(a);
                DOMItems.push(a);
                
                itemStates.push({ webglAlpha: 0 });

                const texture = textureLoader.load(data.src);
                texture.encoding = THREE.sRGBEncoding;

                const material = new THREE.ShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms: {
                        uTexture: { value: texture },
                        uMouse: { value: new THREE.Vector2(0.5, 0.5) },
                        uHover: { value: 0 },
                        uOpacity: { value: 0 },
                        uMeshSize: { value: new THREE.Vector2(100, 100) },
                        uImageSize: { value: new THREE.Vector2(800, 533) } 
                    },
                    transparent: true
                });

                const mesh = new THREE.Mesh(planeGeometry, material);
                scene.add(mesh);
                meshes.push(mesh);
                
                const img = document.createElement('img');
                img.src = data.src;
                img.draggable = false;
                a.appendChild(img);
            });
            
            let currentHoveredIndex = -1;

            // --- ROBUST GLOBAL CLICK HANDLER ---
            // Because DOM images are constantly moving, native click events are often dropped 
            // if the mouse moves even 1 pixel during the click. This relies on our exact 
            // 3D hit-testing state to guarantee clicks register every single time.
            window.addEventListener('click', (e) => {
                if (!interactionsEnabled || isTransitioning) return;
                
                // Let fixed UI elements handle their own clicks
                if (e.target.closest('.ui-layer, .proceed-btn, #loading-overlay, .tt-arrow-box')) return;

                // ON MOBILE: Ignore screen taps so users must use the tooltip arrow button
                if (!isDesktop) return;

                if (currentHoveredIndex !== -1) {
                    e.preventDefault();
                    transitionToPage(galleryData[currentHoveredIndex].link);
                }
            });

            function triggerEnter(index) {
                const mesh = meshes[index];
                const domItem = DOMItems[index];
                const data = galleryData[index];
                
                gsap.to(itemStates[index], { webglAlpha: 1, duration: 0.1, overwrite: 'auto' });
                gsap.to(mesh.material.uniforms.uHover, { value: 1, duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
                
                tooltipTitle.textContent = data.name;
                tooltipCategory.textContent = data.title;
                
                gsap.killTweensOf(tooltip, "opacity,visibility,autoAlpha");
                gsap.killTweensOf([tooltipMask, tooltipTitle, tooltipCategory, tooltipArrow]);

                gsap.set([tooltipTitle, tooltipCategory], { x: -30, opacity: 0 });
                gsap.set(tooltipArrow, { x: -20, opacity: 0 });
                gsap.set(tooltip, { autoAlpha: 1 });
                gsap.fromTo(tooltipMask, 
                    { clipPath: 'inset(0% 100% 0% 0%)' },
                    { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.5, ease: 'power3.out' }
                );
                gsap.to([tooltipTitle, tooltipCategory], { x: 0, opacity: 1, duration: 0.5, stagger: 0.1, delay: 0.1, ease: 'power3.out' });
                gsap.to(tooltipArrow, { x: 0, opacity: 1, duration: 0.5, delay: 0.25, ease: 'power3.out' });
            }

            function triggerLeave(index) {
                const mesh = meshes[index];
                const domItem = DOMItems[index];
                
                gsap.to(itemStates[index], { webglAlpha: 0, duration: 1.2, ease: 'power2.out', overwrite: 'auto' });
                gsap.to(mesh.material.uniforms.uHover, { value: 0, duration: 1.2, ease: 'power2.out', overwrite: 'auto' });

                gsap.killTweensOf(tooltip, "opacity,visibility,autoAlpha");
                gsap.killTweensOf([tooltipMask, tooltipTitle, tooltipCategory, tooltipArrow]);

                gsap.to(tooltipMask, { 
                    clipPath: 'inset(0% 100% 0% 0%)', 
                    duration: 0.4, 
                    ease: 'power3.inOut',
                    onComplete: () => gsap.set(tooltip, { autoAlpha: 0 })
                });
                gsap.to([tooltipTitle, tooltipCategory, tooltipArrow], { x: 20, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power2.in' });
            }

            function getInterpolatedState(t) {
                let x, y, wPx, hPx, o;
                if (isDesktop) {
                    const wave = Math.sin((t - 0.05) * Math.PI * 2);
                    const stretch = Math.abs(wave);
                    x = -0.1 + (t * 1.0); 
                    const baseW = window.innerWidth * 0.18;
                    const baseH = window.innerHeight * 0.32;
                    wPx = baseW * (1 + stretch * 0.85);
                    hPx = baseH * (1 - stretch * 0.15);
                    const bottomBarPx = Math.max(100, Math.min(window.innerHeight * 0.14, 160));
                    const bottomBarTopRatio = (window.innerHeight - bottomBarPx) / window.innerHeight;
                    const maxImageHalfHeightRatio = (baseH * 0.85 / 2) / window.innerHeight;
                    const maxY = bottomBarTopRatio - maxImageHalfHeightRatio;
                    const minY = maxImageHalfHeightRatio + 0.01; 
                    const centerY = (maxY + minY) / 2;
                    const amplitude = (maxY - minY) / 2;
                    y = centerY + (wave * amplitude);
                    if (t < 0.05) o = t / 0.05; 
                    else if (t > 1.10 && t < 1.30) o = (1.30 - t) / 0.2; 
                    else if (t >= 1.30) o = 0; else o = 1;
                } else {
                    y = -0.15 + (t * 2.2); 
                    const wave = Math.sin((t - 0.02) * Math.PI * 4);
                    const stretch = Math.abs(wave);
                    x = 0.5 + (wave * 0.25);
                    const baseW = window.innerWidth * 0.55;
                    const baseH = window.innerHeight * 0.22;
                    wPx = baseW * (1 - stretch * 0.15);
                    hPx = baseH * (1 + stretch * 0.40);
                    if (t < 0.05) o = t / 0.05; 
                    else if (t > 0.45 && t < 0.55) o = (0.55 - t) / 0.10; 
                    else if (t >= 0.55) o = 0; else o = 1;
                }
                const z = Math.round((2 - t) * 1000);
                return { x, y, wPx, hPx, z, o };
            }


            let targetScroll = 10000; 
            let currentScroll = targetScroll;
            let userScrollDistance = 0; 
            let lastUserTickThreshold = 0;

            function checkUserTick() {
                const currentThreshold = Math.floor(userScrollDistance / 60);
                if (currentThreshold !== lastUserTickThreshold) {
                    playTickSound();
                    lastUserTickThreshold = currentThreshold;
                }
            }
            
            window.addEventListener('wheel', (e) => { 
                const delta = e.deltaY * 0.35;
                targetScroll += delta; 
                userScrollDistance += Math.abs(delta); 
                checkUserTick();
            });
            
            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
            
            window.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY; 
                const delta = (touchStartY - touchY) * 1.0;
                targetScroll += delta; 
                userScrollDistance += Math.abs(delta);
                checkUserTick();
                touchStartY = touchY;
            }, { passive: true });

            const clock = new THREE.Clock();

            function render() {
                const time = clock.getElapsedTime();
                
                targetScroll += 0.8; 
                
                let scrollVelocity = (targetScroll - currentScroll) * 0.06;
                currentScroll += scrollVelocity;
                
                bgMaterial.uniforms.uTime.value = time;
                bgMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
                bgMaterial.uniforms.uScroll.value = currentScroll;
                bgRenderer.render(bgScene, bgCamera);

                // --- CURSOR DITHER RENDER PASS ---
                if (isDesktop) {
                    cursorDitherMaterial.uniforms.uTime.value = time;
                    cursorDitherMaterial.uniforms.uScrollVelocity.value = Math.abs(scrollVelocity); 
                    cursorRenderer.render(cursorScene, cursorCamera);
                    
                    const cursorSpinWrapper = document.getElementById('cursor-spin-wrapper');
                    if (cursorSpinWrapper) {
                        cursorSpinWrapper.style.transform = `rotate(${currentScroll * 0.3}deg)`;
                    }
                }

                vLines.forEach((line, i) => {
                    const speed = 0.4 * Math.pow(0.92, i);
                    const phase = (time * speed) + (currentScroll * 0.01);
                    const amplitude = 12 * Math.pow(0.9, i);
                    line.style.transform = `translateX(${Math.sin(phase) * amplitude}px)`;
                });

                const globalOffset = currentScroll / 4000;
                let topHoverIndex = -1;
                let maxZ = -Infinity;
                let minDist = Infinity; 
                
                const calculatedStates = [];
                
                DOMItems.forEach((item, index) => {
                    let t = (globalOffset + (index / galleryData.length) * 2.0) % 2.0;
                    if (t < 0) t = (t % 2.0) + 2.0; 

                    const state = getInterpolatedState(t);
                    const xPx = state.x * window.innerWidth;
                    const yPx = state.y * window.innerHeight;
                    const finalW = state.wPx;
                    const finalH = state.hPx;
                    
                    calculatedStates.push({ xPx, yPx, finalW, finalH, baseZ: state.z, o: state.o });

                    const left = xPx - finalW / 2;
                    const right = xPx + finalW / 2;
                    const top = yPx - finalH / 2;
                    const bottom = yPx + finalH / 2;

                    if (interactionsEnabled && state.o > 0.1) {
                        if (isDesktop) {
                            if (mouseX >= left && mouseX <= right && mouseY >= top && mouseY <= bottom) {
                                if (state.z > maxZ) {
                                    maxZ = state.z;
                                    topHoverIndex = index;
                                }
                            }
                        } else {
                            const screenCenterX = window.innerWidth / 2;
                            const screenCenterY = (window.innerHeight - 90) / 2; 
                            const dist = Math.hypot(xPx - screenCenterX, yPx - screenCenterY);
                            if (dist < minDist && dist < 180) {
                                minDist = dist;
                                topHoverIndex = index;
                            }
                        }
                    }
                });
                
                if (topHoverIndex !== currentHoveredIndex) {
                    if (currentHoveredIndex !== -1) triggerLeave(currentHoveredIndex);
                    if (topHoverIndex !== -1) triggerEnter(topHoverIndex);
                    currentHoveredIndex = topHoverIndex;
                }

                DOMItems.forEach((item, index) => {
                    const cState = calculatedStates[index];
                    const mesh = meshes[index];
                    const iState = itemStates[index];
                    const isHovered = (index === currentHoveredIndex);
                    
                    const finalZ = cState.baseZ + (isHovered ? 5000 : 0);

                    item.style.transform = `translate(${cState.xPx}px, ${cState.yPx}px) translate(-50%, -50%)`;
                    item.style.width = `${cState.finalW}px`;
                    item.style.height = `${cState.finalH}px`;
                    item.style.zIndex = Math.round(finalZ);
                    item.style.opacity = cState.o;

                    mesh.position.set(cState.xPx - innerWidth / 2, -(cState.yPx - innerHeight / 2), finalZ);
                    mesh.scale.set(cState.finalW, cState.finalH, 1);
                    mesh.material.uniforms.uOpacity.value = cState.o * iState.webglAlpha;
                    mesh.material.uniforms.uMeshSize.value.set(cState.finalW, cState.finalH);

                    if (isHovered) {
                        const left = cState.xPx - cState.finalW / 2;
                        const top = cState.yPx - cState.finalH / 2;
                        const effectX = isDesktop ? mouseX : cState.xPx;
                        const effectY = isDesktop ? mouseY : cState.yPx;
                        const uvX = (effectX - left) / cState.finalW;
                        const uvY = 1.0 - ((effectY - top) / cState.finalH);
                        gsap.to(mesh.material.uniforms.uMouse.value, { x: uvX, y: uvY, duration: 0.1, overwrite: 'auto' });
                    }
                });

                if (!isDesktop && currentHoveredIndex !== -1) {
                    const tWidth = tooltip.offsetWidth || 300;
                    const tHeight = tooltip.offsetHeight || 60;
                    xTo(window.innerWidth / 2 - tWidth / 2);
                    yTo(window.innerHeight - 90 - tHeight - 20); 
                }

                renderer.render(scene, camera);
                requestAnimationFrame(render);
            }

            render();

            window.addEventListener('resize', () => {
                bgCamera.updateProjectionMatrix();
                bgRenderer.setSize(window.innerWidth, window.innerHeight);
                bgMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);

                camera.left = window.innerWidth / -2;
                camera.right = window.innerWidth / 2;
                camera.top = window.innerHeight / 2;
                camera.bottom = window.innerHeight / -2;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);

                const currentIsDesktop = window.innerWidth >= 768;
                if(isDesktop !== currentIsDesktop) {
                    isDesktop = currentIsDesktop;
                    location.reload(); 
                }
            });

        });
    </script>
</body>
</html>
